# Stock network buffer sizes (rtspd sends ~4 Mbit/s per viewer), plus hardening.
net.core.rmem_default = 163840
net.core.rmem_max = 163840
net.core.wmem_default = 524288
net.core.wmem_max = 1048576
net.ipv4.tcp_fin_timeout = 30
net.ipv4.tcp_syncookies = 1
# Redirects and source routes: "all" alone doesn't stop an interface (the kernel ORs all and the
# interface for accept/secure/send_redirects on a host), so "default" too, for interfaces made
# later; rcS sets eth0's own before bringing it up. No IPv6 keys: the stock kernel has no IPv6
# (docs/IFADO-PLATFORM.md), so they'd only be unknown-key errors at every boot.
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv4.conf.default.rp_filter = 1
net.ipv4.icmp_echo_ignore_broadcasts = 1
kernel.dmesg_restrict = 1
kernel.kptr_restrict = 2
